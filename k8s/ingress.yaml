apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iluminavp
  namespace: iluminavp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - iluminavp.uilson.com
      secretName: iluminavp-tls
  rules:
    - host: iluminavp.uilson.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iluminavp
                port:
                  number: 80
