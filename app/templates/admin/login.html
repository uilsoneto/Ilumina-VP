{% extends "base.html" %}

{% block title %}Admin — Ilumina VP{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body p-4 text-center">
                <i class="bi bi-shield-lock-fill text-warning" style="font-size: 3rem;"></i>
                <h3 class="mt-3 mb-4">Painel Administrativo</h3>
                <form method="POST">
                    <div class="mb-3 text-start">
                        <label for="password" class="form-label">Senha de acesso</label>
                        <input type="password" class="form-control" id="password" name="password"
                               required placeholder="Digite a senha">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Acessar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
